[package]
name = "git-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Host-agnostic git history, diff, and status engine shared across surdy's apps (pterm, madari, notesmith)."
repository = "https://github.com/surdy/git-core"

[dependencies]
serde = { version = "1", features = ["derive"] }
shared_child = "1"

[dev-dependencies]
tempfile = "3"
